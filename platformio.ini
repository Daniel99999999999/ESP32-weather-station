[platformio]
description = ESP32 weather station
; ------------------------------------------------------------------------------
; Backup / restore reference commands for full flash dump over serial.
; These commands are NOT executed by PlatformIO automatically.
; They are kept here as a project-local reference.
;
; COM10 backup (full 4 MB flash: bootloader + partitions + app + LittleFS/data):
; C:\Users\Daniel\.platformio\penv\Scripts\python.exe C:\Users\Daniel\.platformio\packages\tool-esptoolpy\esptool.py --chip esp32 --port COM10 --baud 460800 read_flash 0x000000 0x400000 factory_backup_full_COM10.bin
;
; COM10 restore:
; C:\Users\Daniel\.platformio\penv\Scripts\python.exe C:\Users\Daniel\.platformio\packages\tool-esptoolpy\esptool.py --chip esp32 --port COM10 --baud 460800 write_flash 0x000000 factory_backup_full_COM10.bin
;
; COM5 backup (full 4 MB flash: bootloader + partitions + app + LittleFS/data):
; C:\Users\Daniel\.platformio\penv\Scripts\python.exe C:\Users\Daniel\.platformio\packages\tool-esptoolpy\esptool.py --chip esp32 --port COM5 --baud 460800 read_flash 0x000000 0x400000 factory_backup_full_COM5.bin
;
; COM5 restore:
; C:\Users\Daniel\.platformio\penv\Scripts\python.exe C:\Users\Daniel\.platformio\packages\tool-esptoolpy\esptool.py --chip esp32 --port COM5 --baud 460800 write_flash 0x000000 factory_backup_full_COM5.bin
; ------------------------------------------------------------------------------

[serial_base]
platform = espressif32@~6.3.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -D DISABLE_ALL_LIBRARY_WARNINGS=1
  -I include
  -Wall
  -Wextra
  -Wunused-variable
  -Wunused-function
  -Wno-unused-parameter
  -Wno-missing-field-initializers
  -Wno-unused-variable
  -Wno-uninitialized
  -D USER_SETUP_LOADED=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=27
  -D LOAD_GLCD=0
  -D LOAD_FONT2=0
  -D LOAD_FONT4=0
  -D LOAD_FONT6=0
  -D LOAD_FONT7=0
  -D LOAD_FONT8=0
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=27000000
board_build.partitions = default.csv
board_build.filesystem = littlefs
lib_deps =
  bodmer/TFT_eSPI@~2.5.30
  bodmer/TJpg_Decoder@~1.0.8
  squix78/JsonStreamingParser@~1.0.5
  thingpulse/ESP8266 Weather Station@~2.2.0

[ota_base]
extends = serial_base
upload_protocol = espota

[env:esp32-3248s035c-serial-com10]
extends = serial_base
upload_port = COM11
monitor_port = COM11

[env:esp32-3248s035c-serial-com5]
extends = serial_base
upload_port = COM5
monitor_port = COM5

[env:esp32-3248s035c-ota-com5]
extends = ota_base
upload_port = 192.168.1.200

[env:esp32-3248s035c-ota-com10]
extends = ota_base
upload_port = 192.168.0.200
